server:
  port: 8089 # random port for local dev or configured by gateway
spring:
  application:
    name: devolucion-service
  datasource:
    url: jdbc:h2:mem:devolucion;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

